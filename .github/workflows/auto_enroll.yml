name: Auto Enroll Udemy Courses

on:
  schedule:
    # Run at 3:00 and 15:00 UTC every day, adjust as needed
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  enroll:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run enrollment script
      env:
        # 方式一(建議): 完整 cookies JSON，一個 secret 搞定
        # 格式: {"client_id": "...", "access_token": "...", "csrftoken": "..."}
        UDEMY_COOKIES: ${{ secrets.UDEMY_COOKIES }}
        # 方式二: 拆開的三個 secrets (與方式一二選一即可，程式會優先用 UDEMY_COOKIES)
        UDEMY_CLIENT_ID: ${{ secrets.UDEMY_CLIENT_ID }}
        UDEMY_ACCESS_TOKEN: ${{ secrets.UDEMY_ACCESS_TOKEN }}
        UDEMY_CSRF_TOKEN: ${{ secrets.UDEMY_CSRF_TOKEN }}
        # 只跑目前穩定的站，跳過 Courson / Course Joiner / E-next（上游改版擋爬蟲）
        # 想全跑就把這行刪掉；想自訂就改成 ${{ secrets.UDEMY_SITES }} 並去設 secret
        UDEMY_SITES: "Real Discount,Discudemy,Udemy Freebies,IDownloadCoupons,Course Vania"
      run: |
        python cli.py
