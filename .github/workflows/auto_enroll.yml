name: Auto Enroll Udemy Courses

on:
  schedule:
    # Run at 3:00 and 15:00 UTC every day, adjust as needed
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  enroll:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run enrollment script
      env:
        UDEMY_CLIENT_ID: ${{ secrets.UDEMY_CLIENT_ID }}
        UDEMY_ACCESS_TOKEN: ${{ secrets.UDEMY_ACCESS_TOKEN }}
      run: |
        python cli.py
